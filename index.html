<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Checklist Pengecekan Mesin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2230;
    --border: #2a3142;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39d353;
    --warn: #f0a500;
    --danger: #ff4444;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --text-dim: #4a5568;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #0a1628 50%, #0d1117 100%);
    border-bottom: 2px solid var(--accent);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 32px rgba(0,212,255,0.12);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), #0066ff);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--text);
  }

  .header-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-ring-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-ring-label {
    text-align: right;
  }

  .progress-ring-label .num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .progress-ring-label .of {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  svg.ring { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 5; }
  .ring-fill { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

  /* MAIN LAYOUT */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  /* MACHINE INFO */
  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .info-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #0066ff, transparent);
  }

  .info-card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .info-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info-field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .info-field input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .info-field input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }

  /* RADIO GROUP */
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    user-select: none;
  }

  .radio-group input[type="radio"] { display: none; }

  .radio-group label:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .radio-group input[type="radio"]:checked + span {
    /* handled by JS */
  }

  .radio-group label.selected {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* CHECKBOX GROUP */
  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    user-select: none;
  }

  .checkbox-group input[type="checkbox"] { display: none; }

  .checkbox-group label:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .checkbox-group input[type="checkbox"]:checked + span {
    /* handled by JS */
  }

  .checkbox-group label.selected {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* SECTIONS GRID */
  .sections-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  /* SECTION CARD */
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .section-card.completed {
    border-color: rgba(57,211,83,0.3);
  }

  .section-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .section-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-num {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    flex-shrink: 0;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .section-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--border);
    color: var(--text-muted);
    transition: all 0.3s;
    white-space: nowrap;
  }

  .section-badge.done {
    background: rgba(57,211,83,0.15);
    color: var(--accent3);
  }

  .section-body {
    padding: 16px 20px;
  }

  /* SUBSECTION */
  .subsection {
    margin-bottom: 16px;
  }

  .subsection:last-child { margin-bottom: 0; }

  .subsection-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .subsection-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* CHECKLIST ITEM */
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    margin-bottom: 4px;
  }

  .check-item:hover { background: rgba(255,255,255,0.04); }

  .check-item input[type="checkbox"] { display: none; }

  .check-box {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 5px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: var(--bg);
  }

  .check-box svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
  }

  .check-item.checked .check-box {
    background: var(--accent3);
    border-color: var(--accent3);
    box-shadow: 0 0 10px rgba(57,211,83,0.3);
  }

  .check-item.checked .check-box svg {
    opacity: 1;
    transform: scale(1);
  }

  .check-label {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    transition: color 0.2s;
    line-height: 1.4;
  }

  .check-item.checked .check-label {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: rgba(57,211,83,0.5);
  }

  /* MINI PROGRESS BAR */
  .mini-progress {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 12px;
    overflow: hidden;
  }

  .mini-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* STATUS CARD */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .status-card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .status-options {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .status-btn {
    flex: 1;
    min-width: 180px;
    padding: 16px 20px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }

  .status-btn:hover { opacity: 0.85; }

  .status-btn.ready.active {
    border-color: var(--accent3);
    background: rgba(57,211,83,0.1);
    color: var(--accent3);
    box-shadow: 0 0 20px rgba(57,211,83,0.2);
  }

  .status-btn.hold.active {
    border-color: var(--warn);
    background: rgba(240,165,0,0.1);
    color: var(--warn);
    box-shadow: 0 0 20px rgba(240,165,0,0.2);
  }

  .status-icon { font-size: 20px; }

  /* NOTES */
  .notes-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .notes-card textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }

  .notes-card textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }

  /* SUBMIT */
  .submit-bar {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-reset {
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-print {
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-print:hover {
    background: rgba(0,212,255,0.1);
  }

  .btn-submit {
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent3), #00a86b);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(57,211,83,0.3);
    text-transform: uppercase;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(57,211,83,0.4);
  }

  .btn-wa {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(37,211,102,0.3);
    text-transform: uppercase;
  }

  .btn-wa:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(37,211,102,0.45);
  }

  /* WA MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid #25D366;
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(37,211,102,0.15);
    transform: scale(0.92) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
  }

  .modal-overlay.open .modal {
    transform: scale(1) translateY(0);
  }

  .modal-header {
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .wa-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .modal-close:hover { background: var(--border); color: var(--text); }

  .modal-body { padding: 18px 22px; }

  .wa-preview {
    background: #0b1f16;
    border: 1px solid rgba(37,211,102,0.2);
    border-radius: 12px;
    padding: 16px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #d1fae5;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 340px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    margin-bottom: 16px;
  }

  .wa-phone-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }

  .wa-phone-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .wa-phone-row input:focus {
    border-color: #25D366;
    box-shadow: 0 0 0 3px rgba(37,211,102,0.15);
  }

  .wa-phone-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .modal-footer {
    padding: 0 22px 20px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn-copy-wa {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-copy-wa:hover { border-color: var(--accent); color: var(--accent); }

  .btn-send-wa {
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  .btn-send-wa:hover { opacity: 0.9; transform: translateY(-1px); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--accent3);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 999;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* TUJUAN BANNER */
  .tujuan-banner {
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(0,102,255,0.08));
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13.5px;
    color: var(--text-muted);
  }

  .tujuan-icon { font-size: 18px; flex-shrink: 0; }

  .tujuan-text strong {
    color: var(--accent);
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 3px;
  }

  /* TIMESTAMP */
  .timestamp {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    margin-bottom: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }

  @media print {
    body { background: white; color: black; }
    .header { position: static; box-shadow: none; background: white; border-bottom: 2px solid #00d4ff; }
    .btn-reset, .btn-print, .btn-submit { display: none; }
    .toast { display: none; }
  }

  @media (max-width: 600px) {
    .header { padding: 14px 16px; }
    .main { padding: 16px 14px 40px; }
    .sections-grid { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .header-title { font-size: 16px; }
    .progress-ring-label .num { font-size: 22px; }
  }

  /* Color variants for section numbers */
  .c1 { background: rgba(0,212,255,0.15); color: var(--accent); }
  .c2 { background: rgba(255,107,53,0.15); color: var(--accent2); }
  .c3 { background: rgba(57,211,83,0.15); color: var(--accent3); }

<script>
// ===== DATA =====
const sections = [

      {

  },
  {

    subsections: [
      {
        title: 'Briefing Teknisi',
        items: [
          'Teknisi menerima informasi lokasi',
          'Teknisi memahami instalasi',

          'Teknisi membawa tools lengkap',
        ]
      },
      {
        title: 'Final Check',
        items: [
          'Mesin siap dibawa',
          'Tidak ada kendala pending',
          'Approval supervisor selesai',
        ]
      }
    ]
  }
];

// ===== STATE =====
let checkedState = {};
let currentStatus = null;

// ===== RENDER SECTIONS =====
function renderSections() {
  const grid = document.getElementById('sectionsGrid');
  grid.innerHTML = '';

  sections.forEach(sec => {
    const allItems = sec.subsections.flatMap(s => s.items);
    const card = document.createElement('div');
    card.className = 'section-card';
    card.id = 'card_' + sec.id;

    let subsHtml = '';
    sec.subsections.forEach(sub => {
      let itemsHtml = sub.items.map((item, i) => {
        const key = sec.id + '_' + sub.title + '_' + i;
        const checked = checkedState[key] ? 'checked' : '';
        return `
          <label class="check-item ${checked}" onclick="toggleCheck('${key}', this, event)" data-key="${key}">
            <input type="checkbox" ${checked}>
            <div class="check-box">
              <svg viewBox="0 0 12 12" fill="none">
                <path d="M1.5 6L4.5 9L10.5 3" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="check-label">${item}</span>
          </label>`;
      }).join('');

      subsHtml += `
        <div class="subsection">
          <div class="subsection-title">${sub.title}</div>
          ${itemsHtml}
        </div>`;
    });

    const checkedCount = allItems.filter((_, i) => {
      const key = sec.id + '_' + sec.subsections[Math.floor(i / sec.subsections[0].items.length)]?.title + '_' + (i % sec.subsections[0].items.length);
      return false;
    }).length;

    card.innerHTML = `
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-num ${sec.color}">${sec.num}</div>
          <div class="section-title">${sec.title}</div>
        </div>
        <div class="section-badge" id="badge_${sec.id}">0 / ${allItems.length}</div>
      </div>
      <div class="section-body">
        ${subsHtml}
        <div class="mini-progress">
          <div class="mini-progress-fill" id="prog_${sec.id}"></div>
        </div>
      </div>`;

    grid.appendChild(card);
  });

  updateProgress();
}

// ===== TOGGLE CHECK =====
function toggleCheck(key, el, event) {
  if (event) event.preventDefault();
  checkedState[key] = !checkedState[key];
  if (checkedState[key]) {
    el.classList.add('checked');
    el.querySelector('input').checked = true;
  } else {
    el.classList.remove('checked');
    el.querySelector('input').checked = false;
  }
  updateProgress();
}

// ===== UPDATE PROGRESS =====
function updateProgress() {
  let totalChecked = 0;
  let totalAll = 0;

  sections.forEach(sec => {
    let secChecked = 0;
    let secTotal = 0;

    sec.subsections.forEach(sub => {
      sub.items.forEach((item, i) => {
        const key = sec.id + '_' + sub.title + '_' + i;
        secTotal++;
        totalAll++;
        if (checkedState[key]) {
          secChecked++;
          totalChecked++;
        }
      });
    });

    // Update badge
    const badge = document.getElementById('badge_' + sec.id);
    if (badge) {
      badge.textContent = secChecked + ' / ' + secTotal;
      badge.className = 'section-badge' + (secChecked === secTotal ? ' done' : '');
    }

    // Update mini progress
    const prog = document.getElementById('prog_' + sec.id);
    if (prog) prog.style.width = (secTotal > 0 ? (secChecked / secTotal * 100) : 0) + '%';

    // Update card border
    const card = document.getElementById('card_' + sec.id);
    if (card) {
      if (secChecked === secTotal && secTotal > 0) card.classList.add('completed');
      else card.classList.remove('completed');
    }
  });

  // Update header ring
  document.getElementById('progressNum').textContent = totalChecked;
  document.getElementById('totalNum').textContent = totalAll;

  const circ = 138.2;
  const pct = totalAll > 0 ? totalChecked / totalAll : 0;
  const offset = circ - (pct * circ);
  document.getElementById('ringFill').style.strokeDashoffset = offset;

  const ringColor = pct === 1 ? '#39d353' : pct > 0.5 ? '#f0a500' : '#00d4ff';
  document.getElementById('ringFill').style.stroke = ringColor;
}

// ===== RADIO SELECT =====
function selectRadio(groupId, el) {
  document.querySelectorAll('#' + groupId + ' label').forEach(l => l.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input').checked = true;
}

// ===== TOGGLE CHECKBOX =====
function toggleCheckbox(el) {
  const checkbox = el.querySelector('input[type="checkbox"]');
  checkbox.checked = !checkbox.checked;
  if (checkbox.checked) {
    el.classList.add('selected');
  } else {
    el.classList.remove('selected');
  }
}

// ===== STATUS =====
function setStatus(val) {
  currentStatus = val;
  document.getElementById('btnReady').classList.remove('active');
  document.getElementById('btnHold').classList.remove('active');
  document.getElementById('btn' + (val === 'ready' ? 'Ready' : 'Hold')).classList.add('active');
}

// ===== RESET =====
function resetAll() {
  if (!confirm('Reset semua checklist? Data yang diisi akan hilang.')) return;
  checkedState = {};
  currentStatus = null;
  document.getElementById('namaMesin').value = '';
  document.getElementById('idMesin').value = '';
  document.getElementById('catatan').value = '';
  document.querySelectorAll('.radio-group label').forEach(l => l.classList.remove('selected'));
  document.querySelectorAll('.checkbox-group label').forEach(l => l.classList.remove('selected'));
  document.querySelectorAll('.checkbox-group input[type="checkbox"]').forEach(cb => cb.checked = false);
  document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
  renderSections();
  showToast('🔄 Semua data berhasil direset', '#ff6b35');
}

// ===== SUBMIT =====
function submitForm() {
  const nama = document.getElementById('namaMesin').value.trim();
  const id = document.getElementById('idMesin').value.trim();
  if (!nama) { showToast('⚠️ Nama mesin belum diisi!', '#f0a500'); return; }
  if (!id) { showToast('⚠️ ID Mesin belum diisi!', '#f0a500'); return; }
  if (!currentStatus) { showToast('⚠️ Status akhir belum dipilih!', '#f0a500'); return; }

  const totalAll = Object.values(checkedState).filter(() => true).length;
  const msg = currentStatus === 'ready'
    ? `✅ Mesin "${nama}" READY TO INSTALL`
    : `⏸️ Mesin "${nama}" HOLD / Perlu Perbaikan`;
  showToast(msg, currentStatus === 'ready' ? '#39d353' : '#f0a500');
}

// ===== TOAST =====
function showToast(msg, color = '#39d353') {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  toast.style.borderColor = color;
  toast.style.color = color;
  toastMsg.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

// ===== TIMESTAMP =====
function setTimestamp() {
  const now = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  document.getElementById('timestampEl').textContent = 'Dibuat: ' + now.toLocaleDateString('id-ID', opts);
}

// ===== WHATSAPP =====
function buildWAText() {
  const nama = document.getElementById('namaMesin').value.trim() || '(belum diisi)';
  const id = document.getElementById('idMesin').value.trim() || '(belum diisi)';
  const catatan = document.getElementById('catatan').value.trim();

  const typeSelected = document.querySelector('#typeGroup label.selected span');
  const type = typeSelected ? typeSelected.textContent : '(belum dipilih)';

  const teknisiSelected = Array.from(document.querySelectorAll('#teknisiGroup input[type="checkbox"]:checked')).map(cb => cb.value);
  const teknisi = teknisiSelected.length > 0 ? teknisiSelected.join(', ') : '(belum dipilih)';

  const picSelected = document.querySelector('#picGroup label.selected span');
  const pic = picSelected ? picSelected.textContent : '(belum dipilih)';

  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  let totalChecked = 0;
  let totalAll = 0;
  sections.forEach(sec => {
    sec.subsections.forEach(sub => {
      sub.items.forEach((_, i) => {
        const key = sec.id + '_' + sub.title + '_' + i;
        totalAll++;
        if (checkedState[key]) totalChecked++;
      });
    });
  });

  const statusLabel = currentStatus === 'ready'
    ? '✅ READY TO INSTALL'
    : currentStatus === 'hold'
    ? '⏸️ HOLD / PERLU PERBAIKAN'
    : '❓ (belum dipilih)';

  let lines = [];
  lines.push('🔧 *SOP CHECKLIST MESIN*');
  lines.push('━━━━━━━━━━━━━━━━━━━━━━');
  lines.push(`📅 ${tgl}, ${jam}`);
  lines.push('');
  lines.push('📋 *INFORMASI MESIN*');
  lines.push(`• Nama Mesin : ${nama}`);
  lines.push(`• ID Mesin   : ${id}`);
  lines.push(`• Type/Model : ${type}`);
  lines.push(`• Teknisi    : ${teknisi}`);
  lines.push(`• PIC QC     : ${pic}`);
  lines.push('');

  sections.forEach(sec => {
    let secChecked = 0;
    let secTotal = 0;
    sec.subsections.forEach(sub => {
      sub.items.forEach((_, i) => {
        const key = sec.id + '_' + sub.title + '_' + i;
        secTotal++;
        if (checkedState[key]) secChecked++;
      });
    });
    const icon = secChecked === secTotal ? '✅' : secChecked > 0 ? '🔶' : '❌';
    lines.push(`${icon} *${sec.num}. ${sec.title}* (${secChecked}/${secTotal})`);

    sec.subsections.forEach(sub => {
      sub.items.forEach((item, i) => {
        const key = sec.id + '_' + sub.title + '_' + i;
        const mark = checkedState[key] ? '☑' : '☐';
        lines.push(`   ${mark} ${item}`);
      });
    });
    lines.push('');
  });

  lines.push('━━━━━━━━━━━━━━━━━━━━━━');
  lines.push(`📊 Progress: ${totalChecked}/${totalAll} item selesai`);
  lines.push(`🏁 *Status Akhir: ${statusLabel}*`);
  if (catatan) {
    lines.push('');
    lines.push(`📝 *Catatan:*\n${catatan}`);
  }
  lines.push('');
  lines.push('_Dikirim via SOP Checklist Mesin_');

  return lines.join('\n');
}

function openWAModal() {
  const text = buildWAText();
  document.getElementById('waPreview').textContent = text;
  document.getElementById('waModal').classList.add('open');
}

function closeWAModal() {
  document.getElementById('waModal').classList.remove('open');
}

function copyWAText() {
  const text = buildWAText();
  navigator.clipboard.writeText(text).then(() => {
    showToast('📋 Teks berhasil di-copy!', '#25D366');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Teks berhasil di-copy!', '#25D366');
  });
}

function sendToWA() {
  const text = buildWAText();
  const phone = document.getElementById('waPhone').value.trim().replace(/\D/g, '');
  const encoded = encodeURIComponent(text);
  const url = phone
    ? `https://wa.me/${phone}?text=${encoded}`
    : `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
}

// Close modal on overlay click
document.getElementById('waModal').addEventListener('click', function(e) {
  if (e.target === this) closeWAModal();
});

// ===== INIT =====
renderSections();
setTimestamp();

// Initialize checkbox event listeners for teknisi
document.querySelectorAll('#teknisiGroup input[type="checkbox"]').forEach(checkbox => {
  checkbox.addEventListener('change', function() {
    const label = this.closest('label');
    if (this.checked) {
      label.classList.add('selected');
    } else {
      label.classList.remove('selected');
    }
  });
});
</script>
